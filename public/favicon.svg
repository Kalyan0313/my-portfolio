<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Square Base -->
  <rect width="64" height="64" rx="16" fill="#0A0A0A" />
  
  <!-- Subtle Amber Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(245, 158, 11, 0.40)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 12 18 L 12 12 L 18 12" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 52 18 L 52 12 L 46 12" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 12 46 L 12 52 L 18 52" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 52 46 L 52 52 L 46 52" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Bold Geometric 'K' -->
  <path
    d="M 22 16 L 28 16 L 28 48 L 22 48 Z 
       M 27 34 L 41 16 L 49 16 L 33 34 L 50 48 L 42 48 Z"
    fill="url(#amberGrad)"
    filter="url(#glow)"
  />
</svg>