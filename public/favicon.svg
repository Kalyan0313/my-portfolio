<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A" />
  
  <!-- Subtle Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 10 16 L 10 10 L 16 10" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 54 16 L 54 10 L 48 10" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 10 48 L 10 54 L 16 54" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <path d="M 54 48 L 54 54 L 48 54" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

  <!-- Monogram Text KM -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="'Space Grotesk', -apple-system, sans-serif" 
    font-weight="800" 
    font-size="24" 
    letter-spacing="-0.04em" 
    fill="url(#amberGrad)"
    filter="url(#glow)"
  >
    KM
  </text>
</svg>