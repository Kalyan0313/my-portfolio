<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0A100F"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect width="800" height="450" fill="url(#dot-grid3)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow3)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="138" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
    <text x="24" y="16" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">NODE.JS RUNTIME</text>
  </g>

  <!-- Central Event Loop Turbine / High-Throughput Core Art -->
  <g transform="translate(400, 230)">
    <!-- Outer Orbit Ring with Phase Nodes -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- 4 Orbiting Phase Nodes -->
    <!-- Timers (Top) -->
    <g transform="translate(0, -105)">
      <circle cx="0" cy="0" r="18" fill="#0A0A10" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#FCD34D" filter="url(#soft-glow3)"/>
      <text x="0" y="-24" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10">TIMERS</text>
    </g>

    <!-- I/O Poll (Right) -->
    <g transform="translate(105, 0)">
      <circle cx="0" cy="0" r="18" fill="#0A0A10" stroke="#10B981" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#10B981" filter="url(#soft-glow3)"/>
      <text x="30" y="4" text-anchor="start" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">I/O POLL</text>
    </g>

    <!-- Check / SetImmediate (Bottom) -->
    <g transform="translate(0, 105)">
      <circle cx="0" cy="0" r="18" fill="#0A0A10" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#FCD34D" filter="url(#soft-glow3)"/>
      <text x="0" y="28" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10">CHECK</text>
    </g>

    <!-- Close (Left) -->
    <g transform="translate(-105, 0)">
      <circle cx="0" cy="0" r="18" fill="#0A0A10" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="rgba(255, 255, 255, 0.5)"/>
      <text x="-30" y="4" text-anchor="end" fill="rgba(255, 255, 255, 0.6)" font-family="'JetBrains Mono', monospace" font-size="10">CLOSE</text>
    </g>

    <!-- Core Center Reactor -->
    <circle cx="0" cy="0" r="60" fill="rgba(10, 15, 12, 0.95)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">EVENT LOOP</text>
    <text x="0" y="14" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">&lt; 1ms LAG</text>

    <!-- Outer Multi-Core Workers -->
    <g transform="translate(-210, 0)">
      <rect x="-30" y="-30" width="60" height="60" rx="6" fill="#09090D" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CORE 0</text>
      <text x="0" y="14" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9">LIBUV</text>
    </g>

    <g transform="translate(210, 0)">
      <rect x="-30" y="-30" width="60" height="60" rx="6" fill="#09090D" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CLUSTER</text>
      <text x="0" y="14" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9">WORKERS</text>
    </g>

    <line x1="-180" y1="0" x2="-130" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="130" y1="0" x2="180" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
