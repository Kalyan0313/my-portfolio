<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-3" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-3)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-3)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 65)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="30">Node.js Concurrency Architecture</text>
  </g>

  <!-- ================= MAIN CONCURRENCY ARCHITECTURE FLOW ================= -->

  <!-- Left: Call Stack (Box: X 60 to 210, width 150) -->
  <g transform="translate(135, 250)">
    <rect x="-75" y="-62" width="150" height="124" rx="14" fill="rgba(59, 130, 246, 0.06)" stroke="#3B82F6" stroke-width="2.6"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="28">Call Stack</text>
    <text x="0" y="24" text-anchor="middle" fill="#93C5FD" class="sketch-sub" font-size="18">Single Thread</text>
  </g>

  <!-- Arrow 1 (Gap: 210 to 315 = 105px spacious clearance) -->
  <g transform="translate(215, 250)">
    <path d="M 0 0 C 25 -6, 65 -6, 92 0" fill="none" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="92,0 82,-5 84,0 82,5" fill="#F59E0B"/>
    <text x="46" y="-14" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="16">I/O Tasks</text>
  </g>

  <!-- Center: Event Loop Core (Ellipse: X 315 to 485, rx 85) -->
  <g transform="translate(400, 250)">
    <ellipse cx="0" cy="0" rx="85" ry="78" fill="rgba(245, 158, 11, 0.06)" stroke="#F59E0B" stroke-width="2.8"/>
    
    <!-- Orbit curves -->
    <path d="M -45 -48 C -12 -66, 30 -62, 55 -36" fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="55,-36 48,-46 51,-40 45,-39" fill="#FCD34D"/>

    <path d="M 45 48 C 12 66, -30 62, -55 36" fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="-55,36 -48,46 -51,40 -45,39" fill="#FCD34D"/>

    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">Event Loop</text>
    <text x="0" y="24" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="18">Non-Blocking</text>
  </g>

  <!-- Arrow 2 (Gap: 485 to 590 = 105px spacious clearance) -->
  <g transform="translate(492, 250)">
    <path d="M 0 0 C 25 -6, 65 -6, 92 0" fill="none" stroke="#10B981" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="92,0 82,-5 84,0 82,5" fill="#10B981"/>
    <text x="46" y="-14" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="16">Offload</text>
  </g>

  <!-- Right: Libuv Worker Pool (Box: X 590 to 740, width 150) -->
  <g transform="translate(665, 250)">
    <rect x="-75" y="-62" width="150" height="124" rx="14" fill="rgba(16, 185, 129, 0.06)" stroke="#10B981" stroke-width="2.6"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="28">Libuv Pool</text>
    <text x="0" y="24" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Worker Threads</text>
  </g>
</svg>
