<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-11" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-11)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-11)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 60)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="31">Working Code vs Production Code</text>
  </g>

  <!-- Comparison Table Container (X: 70 to 730, width 660, height 250, Y: 115 to 365) -->
  <rect x="70" y="115" width="660" height="250" rx="16" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.6"/>

  <!-- Vertical Column Dividers -->
  <line x1="250" y1="115" x2="250" y2="365" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <line x1="490" y1="115" x2="490" y2="365" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Horizontal Row Dividers -->
  <line x1="70" y1="172" x2="730" y2="172" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.2"/>
  <line x1="70" y1="236" x2="730" y2="236" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="730" y2="300" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.6"/>

  <!-- Table Header -->
  <text x="160" y="152" text-anchor="middle" fill="rgba(255, 255, 255, 0.55)" class="sketch-title" font-size="22">Dimension</text>
  <text x="370" y="152" text-anchor="middle" fill="#FCD34D" class="sketch-title" font-size="25">Working Code</text>
  <text x="610" y="152" text-anchor="middle" fill="#6EE7B7" class="sketch-title" font-size="25">Production Ready</text>

  <!-- Row 1: Error Handling -->
  <text x="160" y="210" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="21">Error Handling</text>
  <text x="370" y="210" text-anchor="middle" fill="#FCA5A5" class="sketch-sub" font-size="18">console.log(err)</text>
  <text x="610" y="210" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Structured Logs &amp; Alerts</text>

  <!-- Row 2: Traffic Spikes -->
  <text x="160" y="274" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="21">Traffic Spikes</text>
  <text x="370" y="274" text-anchor="middle" fill="#FCA5A5" class="sketch-sub" font-size="18">Crashes &amp; Hangs</text>
  <text x="610" y="274" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Rate Limits &amp; Queues</text>

  <!-- Row 3: Database -->
  <text x="160" y="338" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="21">Database</text>
  <text x="370" y="338" text-anchor="middle" fill="#FCA5A5" class="sketch-sub" font-size="18">SELECT * (Unbounded)</text>
  <text x="610" y="338" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Indexes &amp; Connection Pool</text>
</svg>
