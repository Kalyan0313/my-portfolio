<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-7" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-7)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-7)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 65)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="31">Relational vs NoSQL Architecture</text>
  </g>

  <!-- ================= MAIN COMPARISON (Spacious Boxes, Zero Touching) ================= -->

  <!-- Left: Relational SQL Box (X: 70 to 320, width 250) -->
  <g transform="translate(195, 250)">
    <rect x="-125" y="-77" width="250" height="154" rx="14" fill="rgba(6, 182, 212, 0.07)" stroke="#06B6D4" stroke-width="3.2"/>
    
    <!-- Clean Horizontal Divider with safe margins -->
    <line x1="-105" y1="-22" x2="105" y2="-22" stroke="#06B6D4" stroke-width="2"/>

    <text x="0" y="-42" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="25">Relational SQL</text>
    <text x="0" y="14" text-anchor="middle" fill="#67E8F9" class="sketch-sub" font-size="20">Strict Schema</text>
    <text x="0" y="46" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="18">ACID Guarantees</text>
  </g>

  <!-- Center: VS Bubble (Vibrant Gold Amber, 3px Border) -->
  <g transform="translate(400, 250)">
    <ellipse cx="0" cy="0" rx="34" ry="32" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" fill="#FCD34D" class="sketch-title" font-size="28">VS</text>
  </g>

  <!-- Right: NoSQL Document Box (X: 480 to 730, width 250 - Wide Padding, No Touching) -->
  <g transform="translate(605, 250)">
    <rect x="-125" y="-77" width="250" height="154" rx="14" fill="rgba(16, 185, 129, 0.07)" stroke="#10B981" stroke-width="3.2"/>
    
    <!-- Clean Horizontal Divider with safe margins -->
    <line x1="-105" y1="-22" x2="105" y2="-22" stroke="#10B981" stroke-width="2"/>

    <text x="0" y="-42" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="25">NoSQL Document</text>
    <text x="0" y="14" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="20">Flexible JSON</text>
    <text x="0" y="46" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="18">Horizontal Scale</text>
  </g>
</svg>
