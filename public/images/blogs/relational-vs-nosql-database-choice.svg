<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#090E16"/>
      <stop offset="100%" stop-color="#081410"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid7" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg7)"/>
  <rect width="800" height="450" fill="url(#dot-grid7)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow7)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="146" height="24" rx="12" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#3B82F6"/>
    <text x="24" y="16" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">DATABASE CHOICE</text>
  </g>

  <!-- Central Split Balance Graphic: SQL Table Mesh vs NoSQL Document Constellation -->
  <g transform="translate(400, 230)">
    <!-- Left: Structured Relational Table Mesh (SQL) -->
    <g transform="translate(-180, 0)">
      <!-- Tabular Grid Graphic -->
      <rect x="-70" y="-55" width="140" height="110" rx="8" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="1.5"/>
      <line x1="-70" y1="-25" x2="70" y2="-25" stroke="#3B82F6" stroke-width="1.5"/>
      <line x1="-20" y1="-55" x2="-20" y2="55" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <line x1="25" y1="-55" x2="25" y2="55" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <line x1="-70" y1="5" x2="70" y2="5" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <line x1="-70" y1="30" x2="70" y2="30" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>

      <text x="0" y="80" text-anchor="middle" fill="#93C5FD" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">RELATIONAL (SQL)</text>
      <text x="0" y="98" text-anchor="middle" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="10">ACID • Strict Schema</text>
    </g>

    <!-- Center VS Emblem -->
    <circle cx="0" cy="0" r="24" fill="#0A0A10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">VS</text>

    <!-- Right: Flexible Document JSON Tree (NoSQL) -->
    <g transform="translate(180, 0)">
      <!-- Document Constellation Graphic -->
      <rect x="-70" y="-55" width="140" height="110" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5"/>
      
      <!-- Nested Brackets / Nodes -->
      <circle cx="-35" cy="-20" r="5" fill="#10B981" filter="url(#soft-glow7)"/>
      <circle cx="0" cy="10" r="5" fill="#10B981" filter="url(#soft-glow7)"/>
      <circle cx="35" cy="-15" r="5" fill="#10B981" filter="url(#soft-glow7)"/>
      <line x1="-35" y1="-20" x2="0" y2="10" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
      <line x1="0" y1="10" x2="35" y2="-15" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>

      <text x="0" y="80" text-anchor="middle" fill="#6EE7B7" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">DOCUMENT (NoSQL)</text>
      <text x="0" y="98" text-anchor="middle" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="10">BASE • Dynamic JSON</text>
    </g>
  </g>
</svg>
