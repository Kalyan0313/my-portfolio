<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#0A1016"/>
      <stop offset="100%" stop-color="#091410"/>
    </linearGradient>
    <filter id="glow-7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-7" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-7)"/>
  <rect width="800" height="450" fill="url(#grid-7)"/>
  <circle cx="400" cy="225" r="170" fill="rgba(59, 130, 246, 0.07)" filter="url(#glow-7)"/>

  <!-- Badges -->
  <rect x="40" y="36" width="160" height="26" rx="3" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1"/>
  <text x="52" y="53" fill="#3B82F6" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">DATABASE DESIGN</text>

  <rect x="210" y="36" width="140" height="26" rx="3" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1"/>
  <text x="222" y="53" fill="#10B981" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">ACID VS BASE</text>

  <!-- Title -->
  <text x="40" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Relational vs NoSQL Decision Matrix</text>
  <text x="40" y="128" fill="rgba(255, 255, 255, 0.55)" font-family="'Courier New', monospace" font-size="13">Strict Schemas vs Document Flexibility • Joins vs Denormalization</text>

  <!-- Split Comparison Layout -->
  <g transform="translate(40, 160)">
    <!-- Left: Relational (PostgreSQL) -->
    <g transform="translate(0, 0)">
      <rect width="345" height="220" rx="6" fill="rgba(59, 130, 246, 0.06)" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="14" y="12" width="105" height="18" rx="2" fill="rgba(59, 130, 246, 0.2)"/>
      <text x="20" y="25" fill="#60A5FA" font-family="'Courier New', monospace" font-size="10" font-weight="bold">RELATIONAL (SQL)</text>
      <text x="14" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">PostgreSQL / MySQL</text>
      
      <g transform="translate(14, 75)">
        <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Strict ACID &amp; Foreign Keys</text>
        <text x="0" y="20" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Complex Relational JOINs</text>
        <text x="0" y="40" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Financial &amp; Billing ledgers</text>
        <text x="0" y="60" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Zero duplicate data redundancy</text>
      </g>

      <rect x="14" y="150" width="317" height="50" rx="4" fill="#040404" stroke="rgba(59, 130, 246, 0.3)"/>
      <text x="22" y="172" fill="#60A5FA" font-family="'Courier New', monospace" font-size="10">BEST FOR: Multi-entity workflows,</text>
      <text x="22" y="188" fill="#E5E7EB" font-family="'Courier New', monospace" font-size="10">strong consistency, strict audit trails</text>
    </g>

    <!-- VS Divider -->
    <circle cx="360" cy="110" r="18" fill="#000000" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="360" y="114" text-anchor="middle" fill="#F59E0B" font-family="'Courier New', monospace" font-size="11" font-weight="bold">VS</text>

    <!-- Right: NoSQL (MongoDB) -->
    <g transform="translate(375, 0)">
      <rect width="345" height="220" rx="6" fill="rgba(16, 185, 129, 0.06)" stroke="#10B981" stroke-width="1.5"/>
      <rect x="14" y="12" width="100" height="18" rx="2" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="20" y="25" fill="#10B981" font-family="'Courier New', monospace" font-size="10" font-weight="bold">DOCUMENT (NoSQL)</text>
      <text x="14" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">MongoDB / DynamoDB</text>
      
      <g transform="translate(14, 75)">
        <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Flexible evolving JSON schema</text>
        <text x="0" y="20" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Embedded sub-document reads</text>
        <text x="0" y="40" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ High-velocity write streaming</text>
        <text x="0" y="60" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="11">✓ Horizontal sharding &amp; scale</text>
      </g>

      <rect x="14" y="150" width="317" height="50" rx="4" fill="#040404" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="22" y="172" fill="#10B981" font-family="'Courier New', monospace" font-size="10">BEST FOR: Telemetry, product catalogs,</text>
      <text x="22" y="188" fill="#E5E7EB" font-family="'Courier New', monospace" font-size="10">rapid feature pivots, real-time activity</text>
    </g>
  </g>

  <!-- Corner Tech Accent -->
  <path d="M 770 20 L 780 20 L 780 30" stroke="#3B82F6" stroke-width="2" fill="none"/>
  <path d="M 20 430 L 20 440 L 30 440" stroke="#3B82F6" stroke-width="2" fill="none"/>
</svg>
