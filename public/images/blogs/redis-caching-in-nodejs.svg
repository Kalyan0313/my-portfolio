<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#14090A"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid6" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)"/>
  <rect width="800" height="450" fill="url(#dot-grid6)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow6)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="138" height="24" rx="12" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#EF4444"/>
    <text x="24" y="16" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">REDIS CACHING</text>
  </g>

  <!-- Central Redis Cache Lightning Reactor Art -->
  <g transform="translate(400, 230)">
    <!-- Outer Invalidation Ring -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="0" cy="0" r="110" fill="rgba(15, 10, 12, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Central Redis Core Hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="rgba(239, 68, 68, 0.15)" stroke="#EF4444" stroke-width="2.5"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#0C0A0E" stroke="#F59E0B" stroke-width="1.5"/>
    
    <!-- Central Lightning Flash -->
    <path d="M 4 -18 L -10 2 L 2 2 L -4 18 L 12 -2 L 0 -2 Z" fill="#FCD34D" filter="url(#soft-glow6)"/>

    <!-- Orbiting Cache Hit & Miss Satellites -->
    <!-- Left: Application Hit (Sub-ms) -->
    <g transform="translate(-180, 0)">
      <circle cx="0" cy="0" r="28" fill="#0A0A10" stroke="#10B981" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">HIT</text>
      <text x="0" y="12" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9">0.2ms</text>
    </g>

    <line x1="-150" y1="0" x2="-60" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Right: Primary DB Protection Barrier -->
    <g transform="translate(180, 0)">
      <circle cx="0" cy="0" r="28" fill="#0A0A10" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="-4" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">DB LOAD</text>
      <text x="0" y="12" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9">-90%</text>
    </g>

    <line x1="60" y1="0" x2="150" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Bottom Badge -->
    <g transform="translate(0, 90)">
      <rect x="-110" y="-13" width="220" height="26" rx="13" fill="#0A0A0E" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CACHE-ASIDE PATTERN</text>
    </g>
  </g>
</svg>
