<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-6" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-6)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-6)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 65)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="30">Redis Cache-Aside Architecture</text>
  </g>

  <!-- ================= MAIN CACHE-ASIDE FLOW ================= -->

  <!-- Left: Application Server Box -->
  <g transform="translate(180, 245)">
    <rect x="-85" y="-60" width="170" height="120" rx="14" fill="rgba(245, 158, 11, 0.06)" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">App Server</text>
    <text x="0" y="24" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="18">Read Request</text>
  </g>

  <!-- Top Branch Arrow (Check Cache) -->
  <g transform="translate(265, 235)">
    <line x1="0" y1="-8" x2="210" y2="-72" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="210,-72 198,-78 200,-72 198,-66" fill="#10B981"/>
    <!-- Positioned cleanly 14px above the line and tilted -17deg -->
    <text x="105" y="-54" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18" transform="rotate(-17, 105, -54)">Check Cache</text>
  </g>

  <!-- Top Right: Redis In-Memory Cache -->
  <g transform="translate(585, 160)">
    <rect x="-105" y="-55" width="210" height="110" rx="14" fill="rgba(239, 68, 68, 0.08)" stroke="#EF4444" stroke-width="2.6"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">Redis Cache</text>
    <text x="0" y="24" text-anchor="middle" fill="#FCA5A5" class="sketch-sub" font-size="18">HIT: 0.2ms Memory</text>
  </g>

  <!-- Bottom Branch Arrow (Miss Fallback) -->
  <g transform="translate(265, 255)">
    <line x1="0" y1="8" x2="210" y2="72" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>
    <polygon points="210,72 198,66 200,72 198,78" fill="#3B82F6"/>
    <!-- Positioned cleanly 14px above the line and tilted +17deg -->
    <text x="105" y="26" text-anchor="middle" fill="#93C5FD" class="sketch-sub" font-size="18" transform="rotate(17, 105, 26)">Cache Miss</text>
  </g>

  <!-- Bottom Right: Primary Database -->
  <g transform="translate(585, 330)">
    <rect x="-105" y="-55" width="210" height="110" rx="14" fill="rgba(59, 130, 246, 0.06)" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">Primary DB</text>
    <text x="0" y="24" text-anchor="middle" fill="#93C5FD" class="sketch-sub" font-size="18">Persistent Store</text>
  </g>
</svg>
