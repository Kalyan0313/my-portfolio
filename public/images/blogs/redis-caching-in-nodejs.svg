<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#140A0A"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </linearGradient>
    <filter id="glow-6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-6)"/>
  <rect width="800" height="450" fill="url(#grid-6)"/>
  <circle cx="400" cy="260" r="160" fill="rgba(239, 68, 68, 0.08)" filter="url(#glow-6)"/>

  <!-- Badges -->
  <rect x="40" y="36" width="160" height="26" rx="3" fill="rgba(239, 68, 68, 0.12)" stroke="#EF4444" stroke-width="1"/>
  <text x="52" y="53" fill="#EF4444" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">REDIS IN-MEMORY</text>

  <rect x="210" y="36" width="160" height="26" rx="3" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1"/>
  <text x="222" y="53" fill="#F59E0B" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">CACHE PATTERNS</text>

  <!-- Title -->
  <text x="40" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">High-Throughput Redis Caching</text>
  <text x="40" y="128" fill="rgba(255, 255, 255, 0.55)" font-family="'Courier New', monospace" font-size="13">Cache-Aside • Stampede Protection • TTL Jitter • Redis Pipelines</text>

  <!-- Visual Architecture Flow: App ➔ Redis (Hit/Miss) ➔ Primary Database -->
  <g transform="translate(40, 160)">
    <!-- Node.js Service Box -->
    <g transform="translate(0, 0)">
      <rect width="180" height="220" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="18" rx="2" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="18" y="25" fill="#FCD34D" font-family="'Courier New', monospace" font-size="10" font-weight="bold">SERVICE</text>
      <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Node.js API</text>
      <text x="12" y="78" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="11">• In-memory query</text>
      <text x="12" y="98" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="11">• JSON serialization</text>
      <text x="12" y="118" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="11">• Connection pool</text>
      <rect x="12" y="150" width="156" height="50" rx="4" fill="#050505" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="172" fill="#F59E0B" font-family="'Courier New', monospace" font-size="10">GET /products:101</text>
      <text x="20" y="188" fill="#10B981" font-family="'Courier New', monospace" font-size="10">Response: 0.8ms</text>
    </g>

    <!-- Arrow to Redis -->
    <path d="M 185 220 L 255 220" stroke="#EF4444" stroke-width="2"/>
    <polygon points="255,216 263,220 255,224" fill="#EF4444"/>
    <text x="220" y="210" text-anchor="middle" fill="#EF4444" font-family="'Courier New', monospace" font-size="10">1. GET</text>

    <!-- Redis Cache Box -->
    <g transform="translate(265, 0)">
      <rect width="220" height="220" rx="6" fill="rgba(239, 68, 68, 0.08)" stroke="#EF4444" stroke-width="2"/>
      <rect x="12" y="12" width="60" height="18" rx="2" fill="#EF4444"/>
      <text x="18" y="25" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="10" font-weight="bold">REDIS</text>
      <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">RAM Datastore</text>
      
      <!-- Cache Hit & Miss tags -->
      <rect x="12" y="75" width="90" height="26" rx="3" fill="#050505" stroke="#10B981" stroke-width="1"/>
      <text x="20" y="92" fill="#10B981" font-family="'Courier New', monospace" font-size="10" font-weight="bold">HIT: 0.2ms</text>

      <rect x="110" y="75" width="95" height="26" rx="3" fill="#050505" stroke="#EF4444" stroke-width="1"/>
      <text x="118" y="92" fill="#EF4444" font-family="'Courier New', monospace" font-size="10">MISS ➔ Fallback</text>

      <rect x="12" y="115" width="196" height="85" rx="4" fill="#050505" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="135" fill="#FCD34D" font-family="'Courier New', monospace" font-size="10">SET prod:101 ex 3600</text>
      <text x="20" y="153" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="10">+ Jitter (+-300s)</text>
      <text x="20" y="171" fill="#10B981" font-family="'Courier New', monospace" font-size="10">99.4% Cache Hit Ratio</text>
      <text x="20" y="189" fill="rgba(255,255,255,0.4)" font-family="'Courier New', monospace" font-size="9">Stampede Lock: Redlock</text>
    </g>

    <!-- Arrow to DB -->
    <path d="M 490 220 L 530 220" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="530,216 538,220 530,224" fill="rgba(255,255,255,0.5)"/>
    <text x="510" y="210" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="9">Miss</text>

    <!-- Primary DB Box -->
    <g transform="translate(540, 0)">
      <rect width="180" height="220" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="18" rx="2" fill="rgba(255, 255, 255, 0.15)"/>
      <text x="18" y="25" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="10" font-weight="bold">SOURCE</text>
      <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">PostgreSQL</text>
      <text x="12" y="78" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="11">• ACID Guarantee</text>
      <text x="12" y="98" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="11">• Master / Replica</text>
      <text x="12" y="118" fill="rgba(255,255,255,0.6)" font-family="'Courier New', monospace" font-size="11">• Protected from spikes</text>
      <rect x="12" y="150" width="156" height="50" rx="4" fill="#050505" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="172" fill="#10B981" font-family="'Courier New', monospace" font-size="10">DB Load: -92%</text>
      <text x="20" y="188" fill="rgba(255,255,255,0.4)" font-family="'Courier New', monospace" font-size="10">Zero connection strain</text>
    </g>
  </g>

  <!-- Corner Tech Accent -->
  <path d="M 770 20 L 780 20 L 780 30" stroke="#EF4444" stroke-width="2" fill="none"/>
  <path d="M 20 430 L 20 440 L 30 440" stroke="#EF4444" stroke-width="2" fill="none"/>
</svg>
