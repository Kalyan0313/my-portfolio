<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-mongo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-mongo" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
    .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-mongo)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-mongo)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 52)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="31">MongoDB Compound Indexing</text>
  </g>

  <!-- Top Code Capsule: Compound Index Definition (Dashed Border) -->
  <g transform="translate(400, 108)">
    <rect x="-270" y="-22" width="540" height="44" rx="12" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="2.2" stroke-dasharray="7,4"/>
    <text x="0" y="6" text-anchor="middle" fill="#DDD6FE" class="code-font" font-size="16">index({ tenantId: 1, status: 1, createdAt: -1 })</text>
  </g>

  <!-- ================= 3 ESR PIPELINE CARDS (Dashed Borders) ================= -->

  <!-- Card 1: Equality (E) (Dashed Electric Cyan, X: 65 to 255, width 190) -->
  <g transform="translate(160, 230)">
    <rect x="-95" y="-62" width="190" height="124" rx="14" fill="rgba(6, 182, 212, 0.07)" stroke="#06B6D4" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="0" y="-26" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">Equality (E)</text>
    <text x="0" y="4" text-anchor="middle" fill="#67E8F9" class="code-font" font-size="16">tenantId: 1</text>
    <text x="0" y="36" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="17">Exact Match Filter</text>
  </g>

  <!-- Arrow 1 (Gap: 255 to 305 = 50px) -->
  <g transform="translate(255, 230)">
    <line x1="6" y1="0" x2="44" y2="0" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="44,0 34,-5 36,0 34,5" fill="#F59E0B"/>
  </g>

  <!-- Card 2: Sort (S) (Dashed Vibrant Amber, X: 305 to 495, width 190) -->
  <g transform="translate(400, 230)">
    <rect x="-95" y="-62" width="190" height="124" rx="14" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="3.2" stroke-dasharray="8,5"/>
    <text x="0" y="-26" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">Sort (S)</text>
    <text x="0" y="4" text-anchor="middle" fill="#FCD34D" class="code-font" font-size="16">status: 1</text>
    <text x="0" y="36" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="17">Zero-Memory Sort</text>
  </g>

  <!-- Arrow 2 (Gap: 495 to 545 = 50px) -->
  <g transform="translate(495, 230)">
    <line x1="6" y1="0" x2="44" y2="0" stroke="#10B981" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="44,0 34,-5 36,0 34,5" fill="#10B981"/>
  </g>

  <!-- Card 3: Range (R) (Dashed Neon Emerald, X: 545 to 735, width 190) -->
  <g transform="translate(640, 230)">
    <rect x="-95" y="-62" width="190" height="124" rx="14" fill="rgba(16, 185, 129, 0.07)" stroke="#10B981" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="0" y="-26" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">Range (R)</text>
    <text x="0" y="4" text-anchor="middle" fill="#6EE7B7" class="code-font" font-size="16">createdAt: -1</text>
    <text x="0" y="36" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="17">Boundary Seek</text>
  </g>

  <!-- ================= BOTTOM EXECUTION METRIC CAPSULE (Dashed Border) ================= -->
  <g transform="translate(400, 362)">
    <rect x="-290" y="-24" width="580" height="48" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-dasharray="7,4"/>
    <text x="-160" y="7" text-anchor="middle" fill="#F87171" class="sketch-title" font-size="21">COLLSCAN (1,000,000 Docs)</text>
    <text x="0" y="6" text-anchor="middle" fill="#FCD34D" class="sketch-title" font-size="24">→</text>
    <text x="160" y="7" text-anchor="middle" fill="#34D399" class="sketch-title" font-size="21">IXSCAN (10 Docs / 2ms)</text>
  </g>
</svg>
