<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#08110D"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid5" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)"/>
  <rect width="800" height="450" fill="url(#dot-grid5)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow5)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="140" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
    <text x="24" y="16" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">INDEX OPTIMIZER</text>
  </g>

  <!-- Central ESR Rule & B-Tree Scan Hierarchy -->
  <g transform="translate(400, 230)">
    <!-- 3 Tier ESR Blocks -->
    <!-- [E] Quality First -->
    <g transform="translate(-190, 0)">
      <rect x="-65" y="-45" width="130" height="90" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="2"/>
      <circle cx="0" cy="-18" r="14" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="0" y="-13" text-anchor="middle" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">E</text>
      <text x="0" y="14" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">EQUALITY</text>
      <text x="0" y="30" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9">Exact Match</text>
    </g>

    <!-- Flow Arrow 1 -->
    <path d="M -120 0 L -80 0" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="-80,-4 -72,0 -80,4" fill="#F59E0B"/>

    <!-- [S] Sort Second -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-45" width="130" height="90" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="0" cy="-18" r="14" fill="rgba(245, 158, 11, 0.25)"/>
      <text x="0" y="-13" text-anchor="middle" fill="#FCD34D" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">S</text>
      <text x="0" y="14" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">SORT</text>
      <text x="0" y="30" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9">B-Tree Order</text>
    </g>

    <!-- Flow Arrow 2 -->
    <path d="M 70 0 L 110 0" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="110,-4 118,0 110,4" fill="#F59E0B"/>

    <!-- [R] Range Last -->
    <g transform="translate(190, 0)">
      <rect x="-65" y="-45" width="130" height="90" rx="8" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="0" cy="-18" r="14" fill="rgba(59, 130, 246, 0.25)"/>
      <text x="0" y="-13" text-anchor="middle" fill="#60A5FA" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">R</text>
      <text x="0" y="14" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">RANGE</text>
      <text x="0" y="30" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9">Bound Limits</text>
    </g>

    <!-- Bottom Metric Badge: IXSCAN vs COLLSCAN -->
    <g transform="translate(0, 85)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0A0A0E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">IXSCAN: 0 IN-MEMORY SORT</text>
    </g>
  </g>
</svg>
