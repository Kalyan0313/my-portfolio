<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#09140D"/>
      <stop offset="100%" stop-color="#141209"/>
    </linearGradient>
    <filter id="glow-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-5)"/>
  <rect width="800" height="450" fill="url(#grid-5)"/>
  <circle cx="600" cy="225" r="160" fill="rgba(16, 185, 129, 0.08)" filter="url(#glow-5)"/>

  <!-- Badges -->
  <rect x="40" y="36" width="160" height="26" rx="3" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1"/>
  <text x="52" y="53" fill="#10B981" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">MONGODB &amp; NOSQL</text>

  <rect x="210" y="36" width="140" height="26" rx="3" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1"/>
  <text x="222" y="53" fill="#F59E0B" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">THE ESR RULE</text>

  <!-- Title -->
  <text x="40" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">MongoDB Compound Indexing</text>
  <text x="40" y="128" fill="rgba(255, 255, 255, 0.55)" font-family="'Courier New', monospace" font-size="13">Equality ➔ Sort ➔ Range • IXSCAN Execution • Zero In-Memory Sorting</text>

  <!-- Diagram Visuals: ESR Formula & Index Architecture -->
  <g transform="translate(40, 160)">
    <!-- ESR Rule Visual Header -->
    <g transform="translate(0, 0)">
      <!-- E Box -->
      <rect x="0" y="0" width="220" height="90" rx="5" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1.5"/>
      <text x="16" y="24" fill="#10B981" font-family="'Courier New', monospace" font-size="11" font-weight="bold">[E] EQUALITY FIRST</text>
      <text x="16" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">{ tenantId: "org_1" }</text>
      <text x="16" y="70" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="10">Filters to single branch</text>

      <!-- S Box -->
      <rect x="240" y="0" width="220" height="90" rx="5" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="16" y="24" fill="#FCD34D" font-family="'Courier New', monospace" font-size="11" font-weight="bold">[S] SORT SECOND</text>
      <text x="16" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">{ createdAt: -1 }</text>
      <text x="16" y="70" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="10">Walks B-Tree in index order</text>

      <!-- R Box -->
      <rect x="480" y="0" width="240" height="90" rx="5" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="16" y="24" fill="#60A5FA" font-family="'Courier New', monospace" font-size="11" font-weight="bold">[R] RANGE LAST</text>
      <text x="16" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">{ status: { $in: [...] } }</text>
      <text x="16" y="70" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="10">Bounds the final result range</text>
    </g>

    <!-- Index Definition & Execution Comparison -->
    <g transform="translate(0, 110)">
      <rect width="720" height="110" rx="6" fill="#040404" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
      
      <g transform="translate(20, 20)">
        <text x="0" y="16" fill="#10B981" font-family="'Courier New', monospace" font-size="11" font-weight="bold">Compound Index:</text>
        <text x="140" y="16" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="12">db.trips.createIndex({ tenantId: 1, status: 1, startTime: -1 })</text>

        <text x="0" y="44" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="11">COLLSCAN (Bad):</text>
        <text x="140" y="44" fill="#EF4444" font-family="'Courier New', monospace" font-size="11">docsExamined: 2,500,000 • execTime: 1840ms • memSort: YES</text>

        <text x="0" y="68" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="11">IXSCAN (ESR):</text>
        <text x="140" y="68" fill="#10B981" font-family="'Courier New', monospace" font-size="11" font-weight="bold">keysExamined: 20 • docsExamined: 20 • execTime: 0.4ms (4600x faster)</text>
      </g>
    </g>
  </g>

  <!-- Corner Tech Accent -->
  <path d="M 770 20 L 780 20 L 780 30" stroke="#10B981" stroke-width="2" fill="none"/>
  <path d="M 20 430 L 20 440 L 30 440" stroke="#10B981" stroke-width="2" fill="none"/>
</svg>
