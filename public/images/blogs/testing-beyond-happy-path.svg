<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-10" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-10)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-10)"/>

  <!-- Distinct Bold Headline -->
  <g transform="translate(400, 62)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="31">Failure Mode &amp; Chaos Testing</text>
  </g>

  <!-- ================= 3 ROUND BOXES (Box size same, Text size decreased) ================= -->

  <!-- Round Box 1: Happy Path (Neon Emerald, rx=28, 210px x 162px) -->
  <g transform="translate(155, 250)">
    <rect x="-105" y="-81" width="210" height="162" rx="28" fill="rgba(16, 185, 129, 0.07)" stroke="#10B981" stroke-width="3.2"/>
    <text x="0" y="-28" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">Happy Path</text>
    <text x="0" y="10" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">200 OK Baseline</text>
    <text x="0" y="44" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="16">Valid Input Schema</text>
  </g>

  <!-- Clean Arrow 1 (Gap: 260 to 295 = 35px) -->
  <g transform="translate(260, 250)">
    <line x1="4" y1="0" x2="31" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="31,0 21,-5 23,0 21,5" fill="#F59E0B"/>
  </g>

  <!-- Round Box 2: Chaos Injection (Vibrant Amber, rx=28, 210px x 162px) -->
  <g transform="translate(400, 250)">
    <rect x="-105" y="-81" width="210" height="162" rx="28" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="3.4"/>
    <text x="0" y="-28" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">Chaos Injection</text>
    <text x="0" y="10" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="18">Network Latency</text>
    <text x="0" y="44" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="16">Packet Drops</text>
  </g>

  <!-- Clean Arrow 2 (Gap: 505 to 540 = 35px) -->
  <g transform="translate(505, 250)">
    <line x1="4" y1="0" x2="31" y2="0" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="31,0 21,-5 23,0 21,5" fill="#EF4444"/>
  </g>

  <!-- Round Box 3: Circuit Breaker (Rose Red, rx=28, 210px x 162px) -->
  <g transform="translate(645, 250)">
    <rect x="-105" y="-81" width="210" height="162" rx="28" fill="rgba(239, 68, 68, 0.07)" stroke="#EF4444" stroke-width="3.2"/>
    <text x="0" y="-28" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">Circuit Breaker</text>
    <text x="0" y="10" text-anchor="middle" fill="#FCA5A5" class="sketch-sub" font-size="18">Fast Failover</text>
    <text x="0" y="44" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="16">Self Healing</text>
  </g>
</svg>
