<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#140D0E"/>
      <stop offset="100%" stop-color="#190A10"/>
    </linearGradient>
    <filter id="glow-10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-10" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-10)"/>
  <rect width="800" height="450" fill="url(#grid-10)"/>
  <circle cx="250" cy="240" r="160" fill="rgba(236, 72, 153, 0.07)" filter="url(#glow-10)"/>

  <!-- Badges -->
  <rect x="40" y="36" width="150" height="26" rx="3" fill="rgba(236, 72, 153, 0.12)" stroke="#EC4899" stroke-width="1"/>
  <text x="52" y="53" fill="#EC4899" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">QUALITY ASSURANCE</text>

  <rect x="200" y="36" width="150" height="26" rx="3" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1"/>
  <text x="212" y="53" fill="#F59E0B" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">EDGE CASE MATRIX</text>

  <!-- Title -->
  <text x="40" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Testing Beyond the Happy Path</text>
  <text x="40" y="128" fill="rgba(255, 255, 255, 0.55)" font-family="'Courier New', monospace" font-size="13">Handling Zero, Null, Timeout, Duplicate Concurrent Webhooks &amp; Network Partitions</text>

  <!-- Visual Test Matrix and Incident Lessons -->
  <g transform="translate(40, 160)">
    <!-- Happy Path Card (Simple vs Vulnerable) -->
    <g transform="translate(0, 0)">
      <rect width="345" height="220" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
      <rect x="14" y="12" width="115" height="18" rx="2" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="20" y="25" fill="#F87171" font-family="'Courier New', monospace" font-size="10" font-weight="bold">HAPPY PATH ONLY</text>
      <text x="14" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Fragile In Production</text>
      
      <g transform="translate(14, 75)">
        <text x="0" y="0" fill="#EF4444" font-family="'Courier New', monospace" font-size="11">✗ Assumes network always healthy</text>
        <text x="0" y="20" fill="#EF4444" font-family="'Courier New', monospace" font-size="11">✗ Fails on duplicated webhooks</text>
        <text x="0" y="40" fill="#EF4444" font-family="'Courier New', monospace" font-size="11">✗ Unhandled null/undefined fields</text>
        <text x="0" y="60" fill="#EF4444" font-family="'Courier New', monospace" font-size="11">✗ Silent crashes on timeouts</text>
      </g>

      <rect x="14" y="150" width="317" height="50" rx="4" fill="#040404" stroke="rgba(239, 68, 68, 0.3)"/>
      <text x="22" y="172" fill="#EF4444" font-family="'Courier New', monospace" font-size="10">FAIL: 2 duplicate requests charged user twice</text>
      <text x="22" y="188" fill="rgba(255,255,255,0.4)" font-family="'Courier New', monospace" font-size="9">Lack of Idempotency testing</text>
    </g>

    <!-- Resilient Edge Case Card -->
    <g transform="translate(375, 0)">
      <rect width="345" height="220" rx="6" fill="rgba(16, 185, 129, 0.06)" stroke="#10B981" stroke-width="1.5"/>
      <rect x="14" y="12" width="130" height="18" rx="2" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="20" y="25" fill="#10B981" font-family="'Courier New', monospace" font-size="10" font-weight="bold">DEFENSIVE TESTING</text>
      <text x="14" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Resilient Architecture</text>
      
      <g transform="translate(14, 75)">
        <text x="0" y="0" fill="#10B981" font-family="'Courier New', monospace" font-size="11">✓ Idempotency Key deduplication</text>
        <text x="0" y="20" fill="#10B981" font-family="'Courier New', monospace" font-size="11">✓ Exponential backoff + jitter</text>
        <text x="0" y="40" fill="#10B981" font-family="'Courier New', monospace" font-size="11">✓ Invariant boundary assertions</text>
        <text x="0" y="60" fill="#10B981" font-family="'Courier New', monospace" font-size="11">✓ Graceful degradation fallbacks</text>
      </g>

      <rect x="14" y="150" width="317" height="50" rx="4" fill="#040404" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="22" y="172" fill="#10B981" font-family="'Courier New', monospace" font-size="10">PASS: 50 concurrent requests ➔ 1 order created</text>
      <text x="22" y="188" fill="#FCD34D" font-family="'Courier New', monospace" font-size="9">Zero double charges • 100% Deterministic</text>
    </g>
  </g>

  <!-- Corner Tech Accent -->
  <path d="M 770 20 L 780 20 L 780 30" stroke="#EC4899" stroke-width="2" fill="none"/>
  <path d="M 20 430 L 20 440 L 30 440" stroke="#EC4899" stroke-width="2" fill="none"/>
</svg>
