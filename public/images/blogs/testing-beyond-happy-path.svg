<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#140A10"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid10" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg10)"/>
  <rect width="800" height="450" fill="url(#dot-grid10)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow10)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="146" height="24" rx="12" fill="rgba(236, 72, 153, 0.1)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#EC4899"/>
    <text x="24" y="16" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">DEFENSIVE TESTING</text>
  </g>

  <!-- Central Defensive Resilience Shield Art -->
  <g transform="translate(400, 230)">
    <!-- Outer Chaos Perimeter Barrier -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="rgba(236, 72, 153, 0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Central Emerald Safety Shield -->
    <polygon points="0,-75 65,-40 65,30 0,80 -65,30 -65,-40" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="2.5"/>
    <polygon points="0,-55 45,-28 45,20 0,58 -45,20 -45,-28" fill="#0A0F0D" stroke="#10B981" stroke-width="1.5"/>

    <!-- Checkmark Emblem -->
    <path d="M -16 0 L -4 12 L 18 -10" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow10)"/>

    <!-- 3 Edge Case Test Probes -->
    <!-- Probe 1 (Top Left: Timeout Failure) -->
    <g transform="translate(-150, -60)">
      <circle cx="0" cy="0" r="22" fill="#0A0A10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">TIMEOUT</text>
      <line x1="20" y1="10" x2="60" y2="25" stroke="#F87171" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Probe 2 (Right: Concurrent Race Key) -->
    <g transform="translate(160, 0)">
      <circle cx="0" cy="0" r="24" fill="#0A0A10" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">IDEMPOTENT</text>
      <line x1="-24" y1="0" x2="-65" y2="0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Probe 3 (Bottom Left: Null/Boundary) -->
    <g transform="translate(-150, 60)">
      <circle cx="0" cy="0" r="22" fill="#0A0A10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">NULL/ZERO</text>
      <line x1="20" y1="-10" x2="60" y2="-25" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>
  </g>
</svg>
