<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#090E16"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid9" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg9)"/>
  <rect width="800" height="450" fill="url(#dot-grid9)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow9)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="142" height="24" rx="12" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#3B82F6"/>
    <text x="24" y="16" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">SQL ENGINEERING</text>
  </g>

  <!-- Central Database Engine & Execution Planner Graphic -->
  <g transform="translate(400, 230)">
    <!-- 3 Tier SQL Hierarchy Cards -->
    <!-- Card 1: Analytical SQL -->
    <g transform="translate(-180, 0)">
      <rect x="-65" y="-55" width="130" height="110" rx="8" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="0" cy="-24" r="14" fill="rgba(59, 130, 246, 0.2)"/>
      <text x="0" y="-19" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">01</text>
      <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">ANALYTICS</text>
      <text x="0" y="32" text-anchor="middle" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="9">Window &amp; CTEs</text>
    </g>

    <!-- Connector 1 -->
    <line x1="-115" y1="0" x2="-65" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Card 2: Query Planner (Highlighted Focus) -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-55" width="130" height="110" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="0" cy="-24" r="14" fill="#F59E0B"/>
      <text x="0" y="-19" text-anchor="middle" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">02</text>
      <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">EXPLAIN</text>
      <text x="0" y="32" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9">Index Scans</text>
    </g>

    <!-- Connector 2 -->
    <line x1="65" y1="0" x2="115" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Card 3: Locking & ACID -->
    <g transform="translate(180, 0)">
      <rect x="-65" y="-55" width="130" height="110" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="0" cy="-24" r="14" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="0" y="-19" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">03</text>
      <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">ACID LOCKS</text>
      <text x="0" y="32" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9">Concurrency</text>
    </g>
  </g>
</svg>
