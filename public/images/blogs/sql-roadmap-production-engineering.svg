<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Dark subtle blueprint canvas -->
    <linearGradient id="metro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Graph paper grid -->
    <pattern id="metro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .metro-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
  </style>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#metro-bg)"/>
  <rect width="800" height="450" fill="url(#metro-grid)"/>

  <!-- Top Bold Headline -->
  <g transform="translate(400, 65)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="32">SQL Production Roadmap</text>
  </g>

  <!-- ================= MAIN PURPLE METRO TRACK ================= -->
  <!-- Continuous tube line spanning the 4 enlarged stations -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#7C3AED" stroke-width="16" stroke-linecap="round"/>

  <!-- In-Between Chevron Directional Badges (Centered in the gaps) -->
  <!-- Link 1 (between Station 1 & Station 2) -->
  <g transform="translate(220, 250)">
    <circle cx="0" cy="0" r="16" fill="#5B21B6" stroke="#DDD6FE" stroke-width="2.2"/>
    <path d="M -4 -6 L 4 0 L -4 6" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Link 2 (between Station 2 & Station 3) -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="16" fill="#5B21B6" stroke="#DDD6FE" stroke-width="2.2"/>
    <path d="M -4 -6 L 4 0 L -4 6" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Link 3 (between Station 3 & Station 4) -->
  <g transform="translate(580, 250)">
    <circle cx="0" cy="0" r="16" fill="#5B21B6" stroke="#DDD6FE" stroke-width="2.2"/>
    <path d="M -4 -6 L 4 0 L -4 6" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= THE 4 ENLARGED CORE STATIONS (r = 58) ================= -->

  <!-- Station 1: SQL Basics -->
  <g transform="translate(130, 250)">
    <circle cx="0" cy="0" r="58" fill="#4C1D95" stroke="#C4B5FD" stroke-width="3.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="25">SQL</text>
    <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="25">Basics</text>
  </g>

  <!-- Station 2: Standard Functions -->
  <g transform="translate(310, 250)">
    <circle cx="0" cy="0" r="58" fill="#4C1D95" stroke="#C4B5FD" stroke-width="3.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="24">Standard</text>
    <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="24">Functions</text>
  </g>

  <!-- Station 3: Window Functions -->
  <g transform="translate(490, 250)">
    <circle cx="0" cy="0" r="58" fill="#4C1D95" stroke="#C4B5FD" stroke-width="3.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="24">Window</text>
    <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="24">Functions</text>
  </g>

  <!-- Station 4: Recursive Queries -->
  <g transform="translate(670, 250)">
    <circle cx="0" cy="0" r="58" fill="#4C1D95" stroke="#C4B5FD" stroke-width="3.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="24">Recursive</text>
    <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" class="metro-title" font-size="24">Queries</text>
  </g>
</svg>
