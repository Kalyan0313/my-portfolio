<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-4" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-4)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-4)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 65)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="30">Data Structure Patterns</text>
  </g>

  <!-- Center Vertical Divider -->
  <line x1="400" y1="120" x2="400" y2="380" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.8" stroke-dasharray="6,6"/>

  <!-- ================= LEFT: BINARY SEARCH TREE (Spacious) ================= -->
  <g transform="translate(210, 160)">
    <!-- Root Node (10) -->
    <ellipse cx="0" cy="0" rx="34" ry="32" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="2.6"/>
    <text x="0" y="9" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="26">10</text>
    
    <!-- Left Branch Line -->
    <line x1="-22" y1="22" x2="-65" y2="65" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Left Child Node (5) -->
    <ellipse cx="-75" cy="85" rx="30" ry="28" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="2.4"/>
    <text x="-75" y="94" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">5</text>
    
    <!-- Right Branch Line -->
    <line x1="22" y1="22" x2="65" y2="65" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Right Child Node (20) -->
    <ellipse cx="75" cy="85" rx="30" ry="28" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="2.4"/>
    <text x="75" y="94" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="24">20</text>

    <!-- Subtitle -->
    <text x="0" y="165" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="22">Binary Search Tree</text>
  </g>

  <!-- ================= RIGHT: SLIDING WINDOW PATTERN (Spacious) ================= -->
  <g transform="translate(590, 240)">
    <!-- Array Element 1: 2 -->
    <g transform="translate(-120, 0)">
      <rect x="0" y="-28" width="46" height="56" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
      <text x="23" y="10" text-anchor="middle" fill="rgba(255, 255, 255, 0.6)" class="sketch-title" font-size="24">2</text>
    </g>

    <!-- Highlighted Window Element 2: 4 -->
    <g transform="translate(-68, 0)">
      <rect x="0" y="-28" width="46" height="56" rx="8" fill="rgba(16, 185, 129, 0.10)" stroke="#10B981" stroke-width="2.6"/>
      <text x="23" y="10" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="25">4</text>
    </g>

    <!-- Highlighted Window Element 3: 7 -->
    <g transform="translate(-16, 0)">
      <rect x="0" y="-28" width="46" height="56" rx="8" fill="rgba(16, 185, 129, 0.10)" stroke="#10B981" stroke-width="2.6"/>
      <text x="23" y="10" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="25">7</text>
    </g>

    <!-- Highlighted Window Element 4: 1 -->
    <g transform="translate(36, 0)">
      <rect x="0" y="-28" width="46" height="56" rx="8" fill="rgba(16, 185, 129, 0.10)" stroke="#10B981" stroke-width="2.6"/>
      <text x="23" y="10" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="25">1</text>
    </g>

    <!-- Array Element 5: 9 -->
    <g transform="translate(88, 0)">
      <rect x="0" y="-28" width="46" height="56" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
      <text x="23" y="10" text-anchor="middle" fill="rgba(255, 255, 255, 0.6)" class="sketch-title" font-size="24">9</text>
    </g>

    <!-- Clean Overarching Window Bracket -->
    <path d="M -66 -38 L -66 -50 L 80 -50 L 80 -38" fill="none" stroke="#10B981" stroke-width="2.4" stroke-linecap="round"/>
    <text x="7" y="-60" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="19">Window (k = 3)</text>

    <!-- Subtitle -->
    <text x="7" y="85" text-anchor="middle" fill="#93C5FD" class="sketch-sub" font-size="22">Sliding Window</text>
  </g>
</svg>
