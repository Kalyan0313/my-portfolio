<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#0F1015"/>
      <stop offset="100%" stop-color="#141208"/>
    </linearGradient>
    <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-4)"/>
  <rect width="800" height="450" fill="url(#grid-4)"/>
  <circle cx="500" cy="225" r="160" fill="rgba(245, 158, 11, 0.07)" filter="url(#glow-4)"/>

  <!-- Badges -->
  <rect x="40" y="36" width="140" height="26" rx="3" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1"/>
  <text x="52" y="53" fill="#F59E0B" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">DSA PATTERNS</text>

  <rect x="190" y="36" width="160" height="26" rx="3" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="202" y="53" fill="#E5E7EB" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">PROBLEM BLUEPRINT</text>

  <!-- Title -->
  <text x="40" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Mastering Data Structure Patterns</text>
  <text x="40" y="128" fill="rgba(255, 255, 255, 0.55)" font-family="'Courier New', monospace" font-size="13">Sliding Window • Two Pointers • Monotonic Stack • Interval Merges</text>

  <!-- Pattern Visual Cards -->
  <g transform="translate(40, 160)">
    <!-- Card 1: Sliding Window -->
    <g transform="translate(0, 0)">
      <rect width="225" height="100" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="14" y="24" fill="#FCD34D" font-family="'Courier New', monospace" font-size="11" font-weight="bold">1. SLIDING WINDOW</text>
      <!-- Visual Array -->
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="28" height="28" rx="2" fill="#0A0A0A" stroke="rgba(255,255,255,0.2)"/>
        <text x="14" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11">2</text>
        <rect x="32" y="0" width="28" height="28" rx="2" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="46" y="18" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="bold">1</text>
        <rect x="64" y="0" width="28" height="28" rx="2" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="78" y="18" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="bold">5</text>
        <rect x="96" y="0" width="28" height="28" rx="2" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="110" y="18" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="bold">2</text>
        <rect x="128" y="0" width="28" height="28" rx="2" fill="#0A0A0A" stroke="rgba(255,255,255,0.2)"/>
        <text x="142" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11">8</text>
        <!-- Window Indicator bracket -->
        <path d="M 32 32 L 32 38 L 124 38 L 124 32" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="78" y="48" text-anchor="middle" fill="#F59E0B" font-family="'Courier New', monospace" font-size="9">L ➔ R: O(N) max sum</text>
      </g>
    </g>

    <!-- Card 2: Two Pointers -->
    <g transform="translate(245, 0)">
      <rect width="230" height="100" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
      <text x="14" y="24" fill="#FCD34D" font-family="'Courier New', monospace" font-size="11" font-weight="bold">2. TWO POINTERS</text>
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="28" height="28" rx="2" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5"/>
        <text x="14" y="18" text-anchor="middle" fill="#10B981" font-size="11" font-weight="bold">L</text>
        <rect x="32" y="0" width="28" height="28" rx="2" fill="#0A0A0A" stroke="rgba(255,255,255,0.2)"/>
        <text x="46" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11">3</text>
        <rect x="64" y="0" width="28" height="28" rx="2" fill="#0A0A0A" stroke="rgba(255,255,255,0.2)"/>
        <text x="78" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11">7</text>
        <rect x="96" y="0" width="28" height="28" rx="2" fill="#0A0A0A" stroke="rgba(255,255,255,0.2)"/>
        <text x="110" y="18" text-anchor="middle" fill="#FFFFFF" font-size="11">11</text>
        <rect x="128" y="0" width="28" height="28" rx="2" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5"/>
        <text x="142" y="18" text-anchor="middle" fill="#10B981" font-size="11" font-weight="bold">R</text>
        <text x="78" y="46" text-anchor="middle" fill="#10B981" font-family="'Courier New', monospace" font-size="9">Inward Converge: O(N)</text>
      </g>
    </g>

    <!-- Card 3: Monotonic Stack -->
    <g transform="translate(495, 0)">
      <rect width="225" height="100" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
      <text x="14" y="24" fill="#FCD34D" font-family="'Courier New', monospace" font-size="11" font-weight="bold">3. MONOTONIC STACK</text>
      <text x="14" y="50" fill="rgba(255,255,255,0.8)" font-family="'Courier New', monospace" font-size="11">• Next Greater Element</text>
      <text x="14" y="68" fill="rgba(255,255,255,0.8)" font-family="'Courier New', monospace" font-size="11">• Daily Temperatures</text>
      <text x="14" y="86" fill="#F59E0B" font-family="'Courier New', monospace" font-size="10">Single Pass O(N) Time</text>
    </g>

    <!-- Bottom Row: Big O & Master Theorem Summary -->
    <g transform="translate(0, 120)">
      <rect width="720" height="100" rx="6" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
      <text x="20" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">Algorithmic Efficiency &amp; Memory Footprint</text>
      <g transform="translate(20, 42)">
        <text x="0" y="16" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="11">HashMap / Set Lookup:</text>
        <text x="180" y="16" fill="#10B981" font-family="'Courier New', monospace" font-size="12" font-weight="bold">O(1) Time • O(N) Space</text>

        <text x="380" y="16" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="11">Binary Search:</text>
        <text x="500" y="16" fill="#10B981" font-family="'Courier New', monospace" font-size="12" font-weight="bold">O(log N) Time • O(1) Space</text>

        <text x="0" y="38" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="11">Graph BFS / DFS Traversal:</text>
        <text x="180" y="38" fill="#FCD34D" font-family="'Courier New', monospace" font-size="12" font-weight="bold">O(V + E) Time • O(V) Space</text>

        <text x="380" y="38" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="11">Topological Sort:</text>
        <text x="500" y="38" fill="#FCD34D" font-family="'Courier New', monospace" font-size="12" font-weight="bold">O(V + E) Kahn's Algorithm</text>
      </g>
    </g>
  </g>

  <!-- Corner Tech Accent -->
  <path d="M 770 20 L 780 20 L 780 30" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <path d="M 20 430 L 20 440 L 30 440" stroke="#F59E0B" stroke-width="2" fill="none"/>
</svg>
