<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0E0D14"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>
  <rect width="800" height="450" fill="url(#dot-grid4)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow4)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="130" height="24" rx="12" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#F59E0B"/>
    <text x="24" y="16" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">DSA PATTERNS</text>
  </g>

  <!-- Central Algorithm Visual: Binary Search Tree & Sliding Window Matrix -->
  <g transform="translate(400, 220)">
    <!-- Top: Binary Search Tree Nodes / DAG -->
    <g transform="translate(0, -60)">
      <!-- Root Node -->
      <circle cx="0" cy="0" r="22" fill="#0E0E14" stroke="#F59E0B" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">O(log N)</text>

      <!-- Left Branch & Node -->
      <line x1="-16" y1="16" x2="-65" y2="55" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
      <circle cx="-75" cy="65" r="16" fill="#0A0A0E" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
      <text x="-75" y="69" text-anchor="middle" fill="rgba(255, 255, 255, 0.8)" font-family="'JetBrains Mono', monospace" font-size="10">L</text>

      <!-- Right Branch & Node -->
      <line x1="16" y1="16" x2="65" y2="55" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="75" cy="65" r="16" fill="#0A0A0E" stroke="#10B981" stroke-width="2"/>
      <circle cx="75" cy="65" r="4" fill="#10B981" filter="url(#soft-glow4)"/>
      <text x="75" y="69" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">R</text>
    </g>

    <!-- Bottom: Sliding Window Array Bracket Visual -->
    <g transform="translate(0, 75)">
      <!-- Array Elements -->
      <g transform="translate(-150, -18)">
        <rect x="0" y="0" width="45" height="36" rx="4" fill="#0A0A0E" stroke="rgba(255, 255, 255, 0.12)"/>
        <text x="22.5" y="22" text-anchor="middle" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', monospace" font-size="12">1</text>
        
        <rect x="52" y="0" width="45" height="36" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="74.5" y="22" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">4</text>

        <rect x="104" y="0" width="45" height="36" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="126.5" y="22" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">2</text>

        <rect x="156" y="0" width="45" height="36" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="178.5" y="22" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">9</text>

        <rect x="208" y="0" width="45" height="36" rx="4" fill="#0A0A0E" stroke="rgba(255, 255, 255, 0.12)"/>
        <text x="230.5" y="22" text-anchor="middle" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', monospace" font-size="12">7</text>

        <rect x="260" y="0" width="45" height="36" rx="4" fill="#0A0A0E" stroke="rgba(255, 255, 255, 0.12)"/>
        <text x="282.5" y="22" text-anchor="middle" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', monospace" font-size="12">3</text>
      </g>

      <!-- Active Sliding Window Highlight Bracket -->
      <path d="M -98 24 L -98 32 L 54 32 L 54 24" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <text x="-22" y="48" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SLIDING WINDOW O(N)</text>
    </g>
  </g>
</svg>
