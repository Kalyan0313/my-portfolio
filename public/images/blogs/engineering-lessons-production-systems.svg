<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-2)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-2)"/>

  <!-- Bold Strong Headline (No tilde / negation symbol) -->
  <g transform="translate(400, 68)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="30">Canary Deployment Architecture</text>
  </g>

  <!-- ================= MAIN CANARY ARCHITECTURE FLOW ================= -->

  <!-- Left: Live Traffic Source (Larger Box) -->
  <g transform="translate(180, 245)">
    <rect x="-90" y="-60" width="180" height="120" rx="14" fill="rgba(245, 158, 11, 0.06)" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">Live Traffic</text>
    <text x="0" y="24" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="18">100% Ingress</text>
  </g>

  <!-- Top Branch Arrow: 90% to Stable -->
  <g transform="translate(270, 235)">
    <path d="M 0 -10 C 65 -30, 140 -65, 205 -75" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="205,-75 193,-81 195,-75 193,-69" fill="#10B981"/>
    <text x="100" y="-55" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="20">90%</text>
  </g>

  <!-- Top Right Box: Stable Production Cluster (Larger Box) -->
  <g transform="translate(585, 160)">
    <rect x="-105" y="-57" width="210" height="114" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="2.6"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">Stable v1.0</text>
    <text x="0" y="24" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Healthy &amp; Verified</text>
  </g>

  <!-- Bottom Branch Arrow: 10% to Canary -->
  <g transform="translate(270, 255)">
    <path d="M 0 10 C 65 30, 140 65, 205 75" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="205,75 193,69 195,75 193,81" fill="#F59E0B"/>
    <text x="100" y="68" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="20">10%</text>
  </g>

  <!-- Bottom Right Box: Canary Test Cluster (Larger Box) -->
  <g transform="translate(585, 330)">
    <rect x="-105" y="-57" width="210" height="114" rx="14" fill="rgba(245, 158, 11, 0.06)" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="29">Canary v1.1</text>
    <text x="0" y="24" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="18">Telemetry Watch</text>
  </g>
</svg>
