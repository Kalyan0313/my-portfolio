<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg)"/>
  <rect width="800" height="450" fill="url(#canvas-grid)"/>

  <!-- Bold Strong Headline (No tilde) -->
  <g transform="translate(400, 70)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="30">Layered Architecture Flow</text>
  </g>

  <!-- ================= MAIN ARCHITECTURE FLOW ================= -->

  <!-- Box 1: Client (Bigger box, spacious padding) -->
  <g transform="translate(120, 245)">
    <rect x="-64" y="-60" width="128" height="120" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="26">Client</text>
    <text x="0" y="22" text-anchor="middle" fill="#93C5FD" class="sketch-sub" font-size="18">HTTP Req</text>
  </g>

  <!-- Arrow 1 (Client -> Controller) -->
  <g transform="translate(186, 245)">
    <path d="M 0 0 C 18 -6, 38 -6, 54 0" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="54,0 44,-5 46,0 44,5" fill="#F59E0B"/>
    <text x="27" y="-12" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="16">POST</text>
  </g>

  <!-- Box 2: Controller (Bigger box, no text crowding) -->
  <g transform="translate(306, 245)">
    <rect x="-64" y="-60" width="128" height="120" rx="12" fill="rgba(245, 158, 11, 0.06)" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="26">Controller</text>
    <text x="0" y="22" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="17">Validate DTO</text>
  </g>

  <!-- Arrow 2 (Controller -> Service) -->
  <g transform="translate(372, 245)">
    <path d="M 0 0 C 18 -6, 38 -6, 54 0" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="54,0 44,-5 46,0 44,5" fill="#F59E0B"/>
    <text x="27" y="-12" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="16">DTO</text>
  </g>

  <!-- Box 3: Service (Focal Highlight, Generous Dimensions) -->
  <g transform="translate(494, 245)">
    <rect x="-66" y="-62" width="132" height="124" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="2.6"/>
    <text x="0" y="-10" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="28">Service</text>
    <text x="0" y="22" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Pure Logic</text>
  </g>

  <!-- Arrow 3 (Service -> Database) -->
  <g transform="translate(562, 245)">
    <path d="M 0 0 C 18 -6, 38 -6, 54 0" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="54,0 44,-5 46,0 44,5" fill="#10B981"/>
    <text x="27" y="-12" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="16">Query</text>
  </g>

  <!-- Box 4: Database / Repository (Bigger box) -->
  <g transform="translate(680, 245)">
    <rect x="-64" y="-60" width="128" height="120" rx="12" fill="rgba(59, 130, 246, 0.06)" stroke="#3B82F6" stroke-width="2.2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="26">Database</text>
    <text x="0" y="22" text-anchor="middle" fill="#93C5FD" class="sketch-sub" font-size="17">Repository</text>
  </g>
</svg>
