<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0E0D13"/>
      <stop offset="100%" stop-color="#14110B"/>
    </linearGradient>

    <!-- Amber Glow & Accents -->
    <radialGradient id="glow-amber1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="layer-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.20)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.03)"/>
    </linearGradient>

    <linearGradient id="layer-grad-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>

    <!-- Filter for soft neon glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="450" fill="url(#bg1)"/>
  <rect width="800" height="450" fill="url(#dot-grid1)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow-amber1)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Category Pill Header -->
  <g transform="translate(48, 48)">
    <rect width="136" height="24" rx="12" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#F59E0B"/>
    <text x="24" y="16" fill="#FCD34D" font-family="'JetBrains Mono', 'Ubuntu Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">LAYERED API ARCH</text>
  </g>

  <!-- Isometric / Layered Architecture Stacks Art -->
  <g transform="translate(400, 240)">
    <!-- Layer 4 (Bottom): Database & Persistence -->
    <g transform="translate(0, 75)">
      <!-- Isometric Plane -->
      <polygon points="0,-28 190,26 0,80 -190,26" fill="rgba(20, 20, 26, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
      <polygon points="-190,26 0,80 0,92 -190,38" fill="rgba(10, 10, 14, 0.95)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <polygon points="190,26 0,80 0,92 190,38" fill="rgba(15, 15, 20, 0.95)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      
      <!-- DB Symbol / Label -->
      <text x="0" y="32" text-anchor="middle" fill="rgba(255, 255, 255, 0.55)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">DATA REPOSITORY &amp; DB</text>
      <circle cx="-130" cy="26" r="4" fill="rgba(255, 255, 255, 0.3)"/>
      <circle cx="130" cy="26" r="4" fill="rgba(255, 255, 255, 0.3)"/>
    </g>

    <!-- Connector Streams (L4 to L3) -->
    <line x1="-80" y1="65" x2="-80" y2="35" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="80" y1="65" x2="80" y2="35" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Layer 3: Domain Services (Highlighted Core) -->
    <g transform="translate(0, 15)">
      <polygon points="0,-28 190,26 0,80 -190,26" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="2"/>
      <polygon points="-190,26 0,80 0,92 -190,38" fill="rgba(217, 119, 6, 0.4)" stroke="#F59E0B" stroke-width="1"/>
      <polygon points="190,26 0,80 0,92 190,38" fill="rgba(180, 83, 9, 0.5)" stroke="#F59E0B" stroke-width="1"/>

      <text x="0" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="1">DOMAIN SERVICE LAYER</text>
      <!-- Glow nodes on corners -->
      <circle cx="0" cy="-28" r="4" fill="#FCD34D" filter="url(#soft-glow)"/>
      <circle cx="190" cy="26" r="4" fill="#FCD34D" filter="url(#soft-glow)"/>
      <circle cx="-190" cy="26" r="4" fill="#FCD34D" filter="url(#soft-glow)"/>
      <circle cx="0" cy="80" r="4" fill="#FCD34D" filter="url(#soft-glow)"/>
    </g>

    <!-- Connector Streams (L3 to L2) -->
    <line x1="-80" y1="5" x2="-80" y2="-25" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="80" y1="5" x2="80" y2="-25" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Layer 2: Controllers & DTO Mappings -->
    <g transform="translate(0, -45)">
      <polygon points="0,-28 190,26 0,80 -190,26" fill="rgba(25, 25, 34, 0.85)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>
      <polygon points="-190,26 0,80 0,92 -190,38" fill="rgba(12, 12, 18, 0.95)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <polygon points="190,26 0,80 0,92 190,38" fill="rgba(18, 18, 25, 0.95)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <text x="0" y="32" text-anchor="middle" fill="rgba(255, 255, 255, 0.75)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">CONTROLLER &amp; DTO</text>
    </g>

    <!-- Connector Streams (L2 to L1) -->
    <line x1="-80" y1="-55" x2="-80" y2="-85" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="80" y1="-55" x2="80" y2="-85" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Layer 1 (Top): API Gateway / Routing & Zod Validation -->
    <g transform="translate(0, -105)">
      <polygon points="0,-28 190,26 0,80 -190,26" fill="rgba(30, 30, 42, 0.85)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
      <polygon points="-190,26 0,80 0,92 -190,38" fill="rgba(15, 15, 22, 0.95)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <polygon points="190,26 0,80 0,92 190,38" fill="rgba(22, 22, 30, 0.95)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

      <text x="0" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">ROUTER • ZOD VALIDATION</text>
      
      <!-- Top Incoming API Pulse -->
      <g transform="translate(0, -50)">
        <line x1="0" y1="0" x2="0" y2="28" stroke="#10B981" stroke-width="2" stroke-dasharray="4,2"/>
        <circle cx="0" cy="0" r="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">REST</text>
      </g>
    </g>
  </g>
</svg>
