<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#14120B"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.12)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.02)"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-1)"/>
  <rect width="800" height="450" fill="url(#grid-pattern)"/>

  <!-- Ambient Glow -->
  <circle cx="400" cy="225" r="180" fill="rgba(245, 158, 11, 0.07)" filter="url(#glow-filter)"/>

  <!-- Top Tech Badge Bar -->
  <rect x="40" y="36" width="130" height="26" rx="3" fill="rgba(245, 158, 11, 0.1)" stroke="#F59E0B" stroke-width="1"/>
  <text x="52" y="53" fill="#F59E0B" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">ARCHITECTURE</text>

  <rect x="180" y="36" width="140" height="26" rx="3" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="192" y="53" fill="#E5E7EB" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">EXPRESS + TS</text>

  <!-- Header Title -->
  <text x="40" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Clean Layered REST APIs</text>
  <text x="40" y="128" fill="rgba(255, 255, 255, 0.55)" font-family="'Courier New', monospace" font-size="13">Routes ➔ Controllers ➔ Services ➔ Repositories ➔ DB</text>

  <!-- Diagram Visual: 4 Layer Boxes -->
  <!-- Layer 1: Client & Routes -->
  <g transform="translate(40, 160)">
    <rect width="160" height="220" rx="6" fill="url(#card-grad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="2" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="18" y="25" fill="#FCD34D" font-family="'Courier New', monospace" font-size="10" font-weight="bold">LAYER 1</text>
    <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Routes &amp; DTO</text>
    <text x="12" y="75" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• Zod Validation</text>
    <text x="12" y="95" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• Auth Middleware</text>
    <text x="12" y="115" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• Rate Limiting</text>
    <rect x="12" y="150" width="136" height="50" rx="4" fill="#050505" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="20" y="172" fill="#F59E0B" font-family="'Courier New', monospace" font-size="10">POST /api/v1/orders</text>
    <text x="20" y="188" fill="#10B981" font-family="'Courier New', monospace" font-size="10">201 CREATED</text>
  </g>

  <!-- Flow Arrow 1 -->
  <path d="M 205 270 L 225 270" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="225,266 233,270 225,274" fill="#F59E0B"/>

  <!-- Layer 2: Controllers -->
  <g transform="translate(235, 160)">
    <rect width="160" height="220" rx="6" fill="url(#card-grad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="2" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="18" y="25" fill="#FCD34D" font-family="'Courier New', monospace" font-size="10" font-weight="bold">LAYER 2</text>
    <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Controllers</text>
    <text x="12" y="75" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• HTTP Handling</text>
    <text x="12" y="95" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• req / res Mapping</text>
    <text x="12" y="115" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• Status Code 2xx</text>
    <rect x="12" y="150" width="136" height="50" rx="4" fill="#050505" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="20" y="172" fill="rgba(255,255,255,0.7)" font-family="'Courier New', monospace" font-size="10">dto = parse(req)</text>
    <text x="20" y="188" fill="#F59E0B" font-family="'Courier New', monospace" font-size="10">service.execute()</text>
  </g>

  <!-- Flow Arrow 2 -->
  <path d="M 400 270 L 420 270" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="420,266 428,270 420,274" fill="#F59E0B"/>

  <!-- Layer 3: Services (Domain) -->
  <g transform="translate(430, 160)">
    <rect width="160" height="220" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="12" y="12" width="60" height="18" rx="2" fill="#F59E0B"/>
    <text x="18" y="25" fill="#000000" font-family="'Courier New', monospace" font-size="10" font-weight="bold">CORE</text>
    <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Domain Service</text>
    <text x="12" y="75" fill="rgba(255, 255, 255, 0.8)" font-family="'Courier New', monospace" font-size="11">• Business Rules</text>
    <text x="12" y="95" fill="rgba(255, 255, 255, 0.8)" font-family="'Courier New', monospace" font-size="11">• Transactions</text>
    <text x="12" y="115" fill="rgba(255, 255, 255, 0.8)" font-family="'Courier New', monospace" font-size="11">• Invariant Checks</text>
    <rect x="12" y="150" width="136" height="50" rx="4" fill="#050505" stroke="#F59E0B" stroke-width="1"/>
    <text x="20" y="172" fill="#FCD34D" font-family="'Courier New', monospace" font-size="10">pure business logic</text>
    <text x="20" y="188" fill="#10B981" font-family="'Courier New', monospace" font-size="10">zero http leak</text>
  </g>

  <!-- Flow Arrow 3 -->
  <path d="M 595 270 L 615 270" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="615,266 623,270 615,274" fill="#F59E0B"/>

  <!-- Layer 4: Repositories & Database -->
  <g transform="translate(625, 160)">
    <rect width="145" height="220" rx="6" fill="url(#card-grad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="2" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="18" y="25" fill="#FCD34D" font-family="'Courier New', monospace" font-size="10" font-weight="bold">LAYER 4</text>
    <text x="12" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Repositories</text>
    <text x="12" y="75" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• SQL / Prisma</text>
    <text x="12" y="95" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• MongoDB / Mongoose</text>
    <text x="12" y="115" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="11">• Data Persistence</text>
    <rect x="12" y="150" width="121" height="50" rx="4" fill="#050505" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="20" y="172" fill="#F59E0B" font-family="'Courier New', monospace" font-size="10">db.orders.save()</text>
    <text x="20" y="188" fill="rgba(255, 255, 255, 0.5)" font-family="'Courier New', monospace" font-size="10">returns Entity</text>
  </g>

  <!-- Corner Tech Accent -->
  <path d="M 770 20 L 780 20 L 780 30" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <path d="M 20 430 L 20 440 L 30 440" stroke="#F59E0B" stroke-width="2" fill="none"/>
</svg>
