<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Clean dark canvas gradient -->
    <linearGradient id="canvas-bg-8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Subtle graph paper grid -->
    <pattern id="canvas-grid-8" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;display=swap');
    .sketch-title { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; }
    .sketch-sub { font-family: 'Caveat', cursive, sans-serif; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#canvas-bg-8)"/>
  <rect width="800" height="450" fill="url(#canvas-grid-8)"/>

  <!-- Bold Strong Headline -->
  <g transform="translate(400, 65)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="31">WebSocket Scaling with Redis Pub/Sub</text>
  </g>

  <!-- ================= 3-COLUMN ARCHITECTURE (110px Massive In-Between Clearances) ================= -->

  <!-- Left: Server Node 1 (X: 40 to 180, width 140) -->
  <g transform="translate(110, 250)">
    <rect x="-70" y="-75" width="140" height="150" rx="16" fill="rgba(6, 182, 212, 0.07)" stroke="#06B6D4" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="0" y="-28" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="26">Server 1</text>
    <text x="0" y="12" text-anchor="middle" fill="#67E8F9" class="sketch-sub" font-size="19">WebSocket</text>
    <text x="0" y="44" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="17">10k Clients</text>
  </g>

  <!-- Left In-Between Connector (Gap: 180 to 290 = 110px WIDE SPACE, ZERO OVERLAP) -->
  <g transform="translate(180, 250)">
    <line x1="12" y1="0" x2="98" y2="0" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="98,0 88,-5 90,0 88,5" fill="#F59E0B"/>
    <!-- Positioned right in the middle of 110px gap with 35px padding on both sides -->
    <text x="55" y="-14" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="18">Publish</text>
  </g>

  <!-- Center: Redis Pub/Sub Hub (X: 290 to 510, width 220) -->
  <g transform="translate(400, 250)">
    <rect x="-110" y="-80" width="220" height="160" rx="18" fill="rgba(245, 158, 11, 0.08)" stroke="#F59E0B" stroke-width="3.4" stroke-dasharray="9,5"/>
    <text x="0" y="-30" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="28">Redis Pub/Sub</text>
    <text x="0" y="12" text-anchor="middle" fill="#FCD34D" class="sketch-sub" font-size="20">Message Broker</text>
    <text x="0" y="46" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="18">Cross-Server Sync</text>
  </g>

  <!-- Right In-Between Connector (Gap: 510 to 620 = 110px WIDE SPACE, ZERO OVERLAP) -->
  <g transform="translate(510, 250)">
    <line x1="12" y1="0" x2="98" y2="0" stroke="#10B981" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="98,0 88,-5 90,0 88,5" fill="#10B981"/>
    <!-- Positioned right in the middle of 110px gap with 30px padding on both sides -->
    <text x="55" y="-14" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="18">Subscribe</text>
  </g>

  <!-- Right: Server Node 2 (X: 620 to 760, width 140) -->
  <g transform="translate(690, 250)">
    <rect x="-70" y="-75" width="140" height="150" rx="16" fill="rgba(16, 185, 129, 0.07)" stroke="#10B981" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="0" y="-28" text-anchor="middle" fill="#FFFFFF" class="sketch-title" font-size="26">Server 2</text>
    <text x="0" y="12" text-anchor="middle" fill="#6EE7B7" class="sketch-sub" font-size="19">WebSocket</text>
    <text x="0" y="44" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)" class="sketch-sub" font-size="17">10k Clients</text>
  </g>
</svg>
