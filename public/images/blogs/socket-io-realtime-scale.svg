<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#14110A"/>
    </linearGradient>
    <radialGradient id="glow8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid8" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)"/>
    </pattern>
    <filter id="soft-glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg8)"/>
  <rect width="800" height="450" fill="url(#dot-grid8)"/>
  <circle cx="400" cy="225" r="220" fill="url(#glow8)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 32 48 L 32 32 L 48 32" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 48 L 768 32 L 752 32" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 32 402 L 32 418 L 48 418" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" fill="none"/>
  <path d="M 768 402 L 768 418 L 752 418" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" fill="none"/>

  <!-- Minimal Header Pill -->
  <g transform="translate(48, 48)">
    <rect width="142" height="24" rx="12" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#06B6D4"/>
    <text x="24" y="16" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">REAL-TIME SCALE</text>
  </g>

  <!-- Central Real-Time WebSockets Mesh Constellation Art -->
  <g transform="translate(400, 230)">
    <!-- Central Redis Pub/Sub Mesh Core -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="65" fill="rgba(8, 16, 22, 0.95)" stroke="#06B6D4" stroke-width="2"/>

    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">REDIS ADAPTER</text>
    <text x="0" y="10" text-anchor="middle" fill="#67E8F9" font-family="'JetBrains Mono', monospace" font-size="10">PUB / SUB MESH</text>

    <!-- 4 Bi-Directional WebSocket Room Nodes -->
    <!-- Room Node 1 (Top Left) -->
    <g transform="translate(-130, -75)">
      <circle cx="0" cy="0" r="24" fill="#0A0A10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#06B6D4" filter="url(#soft-glow8)"/>
      <text x="0" y="38" text-anchor="middle" fill="rgba(255, 255, 255, 0.6)" font-family="'JetBrains Mono', monospace" font-size="9">CLIENT 1</text>
      <line x1="16" y1="10" x2="80" y2="45" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,2"/>
    </g>

    <!-- Room Node 2 (Top Right) -->
    <g transform="translate(130, -75)">
      <circle cx="0" cy="0" r="24" fill="#0A0A10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#06B6D4" filter="url(#soft-glow8)"/>
      <text x="0" y="38" text-anchor="middle" fill="rgba(255, 255, 255, 0.6)" font-family="'JetBrains Mono', monospace" font-size="9">CLIENT 2</text>
      <line x1="-16" y1="10" x2="-80" y2="45" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,2"/>
    </g>

    <!-- Room Node 3 (Bottom Left) -->
    <g transform="translate(-130, 75)">
      <circle cx="0" cy="0" r="24" fill="#0A0A10" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#FCD34D" filter="url(#soft-glow8)"/>
      <text x="0" y="38" text-anchor="middle" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9">ROOM: TRIP</text>
      <line x1="16" y1="-10" x2="80" y2="-45" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,2"/>
    </g>

    <!-- Room Node 4 (Bottom Right) -->
    <g transform="translate(130, 75)">
      <circle cx="0" cy="0" r="24" fill="#0A0A10" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#10B981" filter="url(#soft-glow8)"/>
      <text x="0" y="38" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9">DRIVER WS</text>
      <line x1="-16" y1="-10" x2="-80" y2="-45" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,2"/>
    </g>
  </g>
</svg>
